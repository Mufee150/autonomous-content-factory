services:
  - type: web
    name: autonomous-content-factory-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # You'll set this manually in the Render dashboard
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false  # Set this to your Vercel URL after frontend deploy
